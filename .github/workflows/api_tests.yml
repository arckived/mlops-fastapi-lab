name: Train Model and Test API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python -m src.train

      - name: Run API tests
        run: pytest -v --junitxml=test-report-${{ matrix.python-version }}.xml

      - name: Upload test report and model metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.python-version }}
          path: |
            test-report-${{ matrix.python-version }}.xml
            model/metrics.json

      - name: Notify on success
        if: success()
        run: echo "Model trained and all API tests passed on Python ${{ matrix.python-version }}"

      - name: Notify on failure
        if: failure()
        run: echo "Training or API tests failed on Python ${{ matrix.python-version }}"
